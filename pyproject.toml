[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "butterclaw"
version = "0.8.1"
description = "The Agentic SOC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.2",
    "flask-cors>=4.0.0",
    "werkzeug>=3.0.1",
    "requests>=2.31.0",
    "cryptography>=42.0.5",
    "keyring>=24.3.0",
    "keyrings.alt>=5.0.0",
    "psutil>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]