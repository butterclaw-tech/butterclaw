# =======================================================
# ButterClaw v0.6.3.2
# Local Ollama (Local GPU) - ButterClaw in the Container
# =======================================================
# Usage:
#   cp .env.example .env    (customize values)
#   docker-compose up -d    (start the Exoskeleton)
#
# Note: This lightweight architecture assumes you are running 
# your own local Ollama instance on your host machine.
# 
# Use Modelfile.example to pull the custom butterclaw-optimized:latest 
# version of Gemma4:e4b

services:
  butterclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: butterclaw-server
    restart: unless-stopped
    env_file: .env
    volumes:
      - butterclaw-data:/data          # SQLite DB persistence
      # Mount the UI so you can edit HTML without rebuilding
      - ./index.html:/app/index.html   
      - ./routing.html:/app/routing.html
      #- ./data:/data
      # bridge log file out to your host machine(paste + save to test):
      - ./openclaw_gateway.log:/app/openclaw_gateway.log    
    # bridge to host machine's native Ollama  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - butterclaw-net                 # <-- Added to match ntfy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 128m

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      butterclaw:
        condition: service_healthy
    networks:
      - butterclaw-net
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy
    container_name: butterclaw-ntfy
    command: serve
    ports:
      - "2586:80"  
    networks:
      - butterclaw-net                 # <-- Bridges to butterclaw
    volumes:
      - ntfy-data:/var/lib/ntfy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

volumes:
  butterclaw-data:
    name: butterclaw-data
  ntfy-data:

networks:
  butterclaw-net:                      # <-- Officially declares the network
    name: butterclaw-net