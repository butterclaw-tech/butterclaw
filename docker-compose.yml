# =======================================================
# ButterClaw v0.6.3.1 - Full Docker
# Local Ollama (Local GPU) - ButterClaw in the Container
# =======================================================
# Usage:
#   cp .env.example .env    (customize values)
#   docker-compose up -d    (start the Exoskeleton)
#
# Note: This lightweight architecture assumes you are running 
# your own local Ollama instance on your host machine.
# 
# Use Modelfile.example to pull the custom butterclaw-optimized:latest 
# version of Gemma4:e4b

services:
  butterclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: butterclaw-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - butterclaw-data:/data          # SQLite DB persistence
      # Mount the UI so you can edit HTML without rebuilding
      - ./index.html:/app/index.html   
      - ./routing.html:/app/routing.html
      # bridge log file out to your host machine(paste + save to test):
      - ./openclaw_gateway.log:/app/openclaw_gateway.log    
    # bridge to host machine's native Ollama  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - butterclaw-net                 # <-- Added to match ntfy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ntfy:
    image: binwiederhier/ntfy
    container_name: butterclaw-ntfy
    command: serve
    ports:
      - "2586:80"  
    networks:
      - butterclaw-net                 # <-- Bridges to butterclaw

volumes:
  butterclaw-data:
    name: butterclaw-data

networks:
  butterclaw-net:                      # <-- Officially declares the network
    name: butterclaw-net