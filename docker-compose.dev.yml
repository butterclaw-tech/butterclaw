# ButterClaw — Development Compose Override v0.6.6
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This file OVERRIDES the production docker-compose.yml for local development.
# It enables hot-reload, debug logging, and disables TLS termination.
# Ollama runs on the HOST — not as a managed Docker service.
# Use host.docker.internal (Windows/macOS) or 172.17.0.1 (Linux) for OLLAMA_BASE_URL.

services:
  butterclaw-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app                          # hot-reload: source changes reflected immediately
      - /app/__pycache__                # exclude pycache from mount
    environment:
      - BUTTERCLAW_DEBUG=true
      - BUTTERCLAW_LOG_LEVEL=DEBUG
      - BUTTERCLAW_DRY_RUN=true         # hard-blocks Gibson and all destructive actions
      - BUTTERCLAW_API_KEY=${BUTTERCLAW_API_KEY:-dev-bootstrap-key-change-me}
    ports:
      - "5000:5000"                     # direct Flask access — no nginx in dev
    restart: "no"                       # fail-fast in dev; do not auto-restart

  nginx:
    profiles:
      - production                      # nginx is production-only; excluded from dev stack

  butterclaw-ntfy:
    profiles:
      - production                      # ntfy is production-only; excluded from dev stack
