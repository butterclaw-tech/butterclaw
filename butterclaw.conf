# =============================================
# ButterClaw v0.6.3 — Nginx Reverse Proxy
# =============================================
# TLS termination + security headers + SSE proxy support
#
# Prerequisites:
#   - TLS certs in ./nginx/certs/ (fullchain.pem, privkey.pem)
#   - Or use certbot: certbot certonly --standalone -d butterclaw.yourdomain.com

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name butterclaw.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name butterclaw.yourdomain.com;

    # ── TLS ──
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static Dashboard Files ──
    location = / {
        alias /usr/share/nginx/html/;
        try_files /index.html =404;
    }
    location = /index.html {
        root /usr/share/nginx/html;
    }
    location = /routing.html {
        root /usr/share/nginx/html;
    }

    # ── SSE Stream (long-lived connection) ──
    location /api/stream {
        proxy_pass http://butterclaw:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;     # 24h — SSE needs long timeout
        proxy_send_timeout 86400s;
    }

    # ── API (all other /api/ routes) ──
    location /api/ {
        proxy_pass http://butterclaw:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;       # Brain can take 2+ min on large payloads
        client_max_body_size 1m;       # Limit payload size
    }

    # ── Health Check (unauthenticated — for load balancers) ──
    location = /api/health {
        proxy_pass http://butterclaw:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;                # Don't spam access logs
    }
}
