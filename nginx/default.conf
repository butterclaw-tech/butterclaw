server {
    listen 80;
    listen 443 ssl;
    server_name localhost;

    # The Snake Oil certs we mapped in docker-compose
    ssl_certificate /etc/nginx/certs/butterclaw.crt;
    ssl_certificate_key /etc/nginx/certs/butterclaw.key;

    # Route standard traffic to the Flask Exoskeleton
    location / {
        proxy_pass http://butterclaw:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CRITICAL: Tell Nginx NOT to buffer the live SSE event stream
    location /api/stream {
        proxy_pass http://butterclaw:5000/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_cache off;
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }
}